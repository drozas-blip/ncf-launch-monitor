name: regen-and-deploy

# Rebuilds the dashboard data from the live sources and deploys to GitHub Pages.
on:
  schedule:
    - cron: "23 6 * * *"     # 06:23 UTC ≈ 08:23 CEST — off the top of the hour (less delay)
    - cron: "23 11 * * *"    # 11:23 UTC ≈ 13:23 CEST — midday safety net if the morning run is dropped
  workflow_dispatch: {}       # allow manual runs from the Actions tab
  push:
    branches: [main]          # redeploy on layout/code changes
    # Note: the "Commit refreshed data" step pushes with the default GITHUB_TOKEN,
    # and GitHub deliberately does NOT re-trigger workflows for such pushes — so
    # the daily data commit does not start a second run. No loop.

permissions:
  contents: write             # commit refreshed index.html
  pages: write                # deploy Pages
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate HTML anchors (offline, no secrets)
        run: python3 regen/regen.py --check

      - name: Regenerate dashboard data
        id: regen
        env:
          METABASE_URL: ${{ secrets.METABASE_URL }}
          METABASE_USERNAME: ${{ secrets.METABASE_USERNAME }}
          METABASE_PASSWORD: ${{ secrets.METABASE_PASSWORD }}
          MIXPANEL_SA_USERNAME: ${{ secrets.MIXPANEL_SA_USERNAME }}
          MIXPANEL_SA_SECRET: ${{ secrets.MIXPANEL_SA_SECRET }}
          MIXPANEL_PROJECT_ID: ${{ secrets.MIXPANEL_PROJECT_ID }}
          TYPEFORM_TOKEN: ${{ secrets.TYPEFORM_TOKEN }}
          CIO_APP_API_KEY: ${{ secrets.CIO_APP_API_KEY }}
        run: python3 regen/regen.py

      # Only commit when a data block actually changed. The stamp is refreshed
      # every run (so the deployed page always shows a live time), but a
      # stamp-only diff must not add a commit to the history.
      - name: Commit refreshed data
        if: steps.regen.outputs.data_changed == '1'
        run: |
          git config user.name "ncf-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "chore: refresh data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push || echo "nothing to push"

      - name: Assemble site (only the public files)
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp robots.txt _site/robots.txt 2>/dev/null || true
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # GitHub Pages deployments sometimes go live slower than the action's
          # default 10-min poll window — it then reports failure even though the
          # deploy completes moments later. Give it 25 min so a slow-but-fine
          # deploy is reported green. (Data + build already succeeded by here.)
          timeout: 1500000
          error_count: 25
